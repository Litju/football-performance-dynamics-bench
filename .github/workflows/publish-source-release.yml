name: Publish verified source-only research software

on:
  workflow_dispatch:
    inputs:
      source_only_approval:
        description: "Enter RELEASE_V1_SOURCE_ONLY to approve original software/public aggregates only"
        required: true
        type: string
      expected_commit_sha:
        description: "Exact reviewed 40-character main HEAD to tag"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-fpd-v1-source
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'Litju' && inputs.source_only_approval == 'RELEASE_V1_SOURCE_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check exact owner-approved main commit and version identity
        shell: bash
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import tomllib

          pkg = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert pkg["version"] == "1.0.0"
          assert '__version__ = "1.0.0"' in Path("src/fpdbench/__init__.py").read_text()
          lock = tomllib.loads(Path("uv.lock").read_text())
          local = [
              p for p in lock["package"]
              if p["name"] == "football-performance-dynamics-bench"
          ]
          assert len(local) == 1 and local[0]["version"] == pkg["version"]
          cff = Path("CITATION.cff").read_text()
          for required in (
              "cff-version: 1.2.0",
              'title: "Football Performance Dynamics Bench"',
              'family-names: "Rodriguez"',
              'given-names: "Julio"',
              'license: "Apache-2.0"',
              'version: "1.0.0"',
          ):
              assert required in cff, f"missing CFF field: {required}"
          assert not any(line.startswith(("doi:", "date-released:")) for line in cff.splitlines())
          assert Path("LICENSE").is_file()
          assert Path("docs/release-v1.0.0.md").is_file()
          PY
          # The GitHub source archive contains every tracked file, not just the wheel.
          # Even explicitly MIT-licensed samples need a separate payload/license decision.
          test -z "$(git ls-files -- data/)"
          test -z "$(git status --porcelain --untracked-files=no)"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin public synthetic streaming test source
        shell: bash
        run: |
          git fetch --no-tags origin aad8888eb6c7c046e4dfbce866886bf2ec8dd123
          test "$(git rev-parse FETCH_HEAD)" = "aad8888eb6c7c046e4dfbce866886bf2ec8dd123"
          mkdir -p "$RUNNER_TEMP/pr25-package"
          git archive FETCH_HEAD src/fpdbench | tar -x -C "$RUNNER_TEMP/pr25-package"
          echo "FPDBENCH_PR25_PACKAGE_ROOT=$RUNNER_TEMP/pr25-package/src/fpdbench" >> "$GITHUB_ENV"

      - name: Install pinned development environment
        run: uv sync --locked --all-groups --python 3.12

      - name: Validate scientific code, evidence and packaging
        shell: bash
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run pytest
          uv run fpdbench validate-naming
          uv run fpdbench validate
          uv run fpdbench evidence validate
          uv run fpdbench reproducibility check
          uv run python tools/inspect_public_findings.py
          uv run python tools/public_release_asset_manifest.py > "$RUNNER_TEMP/public-aggregate-candidate.json"
          uv build
          uv run python tools/wheel_smoke.py dist/*.whl dist/*.tar.gz
          uv run python tools/res643_package_smoke.py dist/*.whl dist/*.tar.gz
          uv run python tools/res645_package_smoke.py dist/*.whl dist/*.tar.gz

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate companion build and scientific content
        working-directory: site
        run: |
          npm ci
          npm run build
          npm run check:content

      - name: Produce exact source and wheel/sdist release manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          candidate = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "public-aggregate-candidate.json").read_text()
          )
          assert candidate["status"] == "CANDIDATE_ONLY_NOT_PUBLISHED"
          assert candidate["release_authorized"] is False
          assert candidate["protected_population"] == "NOT_QUALIFIED"
          assert len(candidate["entries"]) == 12
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert candidate["source_commit"] == sha == os.environ["GITHUB_SHA"]
          dist = sorted(Path("dist").iterdir())
          assert len(dist) == 2
          assert sum(p.suffix == ".whl" for p in dist) == 1
          assert sum(p.name.endswith(".tar.gz") for p in dist) == 1
          entries = [
              {
                  "name": p.name,
                  "bytes": p.stat().st_size,
                  "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
              }
              for p in dist
          ]
          manifest = {
              "schema": "fpdbench.source-only-github-release-manifest/1",
              "version": "1.0.0",
              "git_sha": sha,
              "license": "Apache-2.0 (original software and documentation only)",
              "software_author": "Julio Rodriguez",
              "protected_population": "NOT_QUALIFIED",
              "private_weights_or_provider_rows_included": False,
              "archive_doi": None,
              "verified_public_aggregate_inventory_sha256": candidate["entries_sha256"],
              "build_artifacts": entries,
          }
          Path("release-artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          mkdir -p release-bundle
          cp dist/*.whl dist/*.tar.gz release-artifact-manifest.json release-bundle/

      - uses: actions/upload-artifact@v4
        with:
          name: fpd-source-only-v1-release-bundle
          path: release-bundle/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'Litju' && inputs.source_only_approval == 'RELEASE_V1_SOURCE_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
      RELEASE_TAG: v1.0.0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: fpd-source-only-v1-release-bundle
          path: release-bundle/

      - name: Verify pinned source, artifact checksums and release scope
        shell: bash
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("release-bundle")
          files = sorted(p for p in root.iterdir() if p.is_file())
          assert len(files) == 3, "unexpected distribution payload"
          manifest = json.loads((root / "release-artifact-manifest.json").read_text())
          assert manifest["schema"] == "fpdbench.source-only-github-release-manifest/1"
          assert manifest["version"] == "1.0.0"
          assert manifest["git_sha"] == os.environ["GITHUB_SHA"]
          assert manifest["protected_population"] == "NOT_QUALIFIED"
          assert manifest["private_weights_or_provider_rows_included"] is False
          assert manifest["archive_doi"] is None
          assert len(manifest["build_artifacts"]) == 2
          for entry in manifest["build_artifacts"]:
              p = root / entry["name"]
              assert p.is_file() and p.name == entry["name"] and p.parent == root
              assert p.stat().st_size == entry["bytes"]
              assert hashlib.sha256(p.read_bytes()).hexdigest() == entry["sha256"]
          PY

      - name: Refuse existing published release or mismatched immutable tag
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite"
            exit 1
          fi
          raw_ref="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          resolved_ref="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG^{}" | awk '{print $1}')"
          if [ -n "$raw_ref" ]; then
            if [ "$resolved_ref" != "$GITHUB_SHA" ]; then
              echo "Existing tag does not resolve to the authorized commit or is not annotated"
              exit 1
            fi
            echo "Verified existing annotated tag at exact commit; release-creation retry allowed"
          fi

      - name: Tag exact verified commit and publish GitHub source-only release
        shell: bash
        run: |
          if [ -z "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "FPD Bench software v1.0.0: source-only research release"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" release-bundle/* \
            --verify-tag \
            --title "FPD Bench v1.0.0 — Public Research Software" \
            --notes-file docs/release-v1.0.0.md
          gh release view "$RELEASE_TAG" --json tagName,url,assets,isPrerelease
