name: Publish authorized software-only source release

on:
  workflow_dispatch:
    inputs:
      source_only_approval:
        description: "Enter RELEASE_V1_SOURCE_ONLY to publish verified original software without private data or weights"
        required: true
        type: string
      expected_commit_sha:
        description: "Exact reviewed 40-character main HEAD to tag; must match this workflow's GITHUB_SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-fpd-v1-source
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' && github.actor == 'Litju' && inputs.source_only_approval == 'RELEASE_V1_SOURCE_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      RELEASE_TAG: v1.0.0
      RELEASE_VERSION: 1.0.0
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact approved main commit before accessing release scope
        shell: bash
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(git branch --show-current)" = ""
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Verify release identity and sole approved software citation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert version == "1.0.0", "release package version mismatch"
          cff = Path("CITATION.cff").read_text()
          for required in (
              "cff-version: 1.2.0",
              'title: "Football Performance Dynamics Bench"',
              'family-names: "Rodriguez"',
              'given-names: "Julio"',
              'license: "Apache-2.0"',
              'version: "1.0.0"',
          ):
              assert required in cff, f"CFF release metadata missing {required}"
          assert not any(line.startswith(("doi:", "date-released:")) for line in cff.splitlines())
          assert Path("LICENSE").is_file()
          assert Path("docs/release-v1.0.0.md").is_file()
          PY
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Pin public synthetic streaming test source
        shell: bash
        run: |
          git fetch --no-tags origin aad8888eb6c7c046e4dfbce866886bf2ec8dd123
          test "$(git rev-parse FETCH_HEAD)" = "aad8888eb6c7c046e4dfbce866886bf2ec8dd123"
          mkdir -p "$RUNNER_TEMP/pr25-package"
          git archive FETCH_HEAD src/fpdbench | tar -x -C "$RUNNER_TEMP/pr25-package"
          echo "FPDBENCH_PR25_PACKAGE_ROOT=$RUNNER_TEMP/pr25-package/src/fpdbench" >> "$GITHUB_ENV"

      - name: Install verified Python dependencies
        run: uv sync --locked --all-groups --python 3.12

      - name: Verify exact-source software, evidence, packaging and tests
        shell: bash
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright
          uv run pytest
          uv run fpdbench validate-naming
          uv run fpdbench validate
          uv run fpdbench evidence validate
          uv run fpdbench reproducibility check
          uv run python tools/inspect_public_findings.py
          uv run python tools/public_release_asset_manifest.py > "$RUNNER_TEMP/aggregate-source-candidate.json"
          uv build
          uv run python tools/wheel_smoke.py dist/*.whl dist/*.tar.gz
          uv run python tools/res643_package_smoke.py dist/*.whl dist/*.tar.gz
          uv run python tools/res645_package_smoke.py dist/*.whl dist/*.tar.gz

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify research companion from public aggregates
        working-directory: site
        run: |
          npm ci
          npm run build
          npm run check:content

      - name: Verify candidate aggregate file classes and emit release manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess

          candidate = json.loads(Path(__import__("os").environ["RUNNER_TEMP"], "aggregate-source-candidate.json").read_text())
          assert candidate["status"] == "CANDIDATE_ONLY_NOT_PUBLISHED"
          assert candidate["release_authorized"] is False
          assert candidate["protected_population"] == "NOT_QUALIFIED"
          assert len(candidate["entries"]) == 12
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert candidate["source_commit"] == sha
          dist = sorted(Path("dist").iterdir())
          assert len(dist) == 2
          assert any(p.suffix == ".whl" for p in dist)
          assert any(p.name.endswith(".tar.gz") for p in dist)
          files = [
              {"name": p.name, "bytes": p.stat().st_size, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
              for p in dist
          ]
          manifest = {
              "schema": "fpdbench.source-only-github-release-manifest/1",
              "version": "1.0.0",
              "git_sha": sha,
              "license": "Apache-2.0 (original software/documentation only)",
              "citation_author": "Julio Rodriguez",
              "protected_population": "NOT_QUALIFIED",
              "data_and_private_weights_included": False,
              "archive_doi": None,
              "distribution": "GitHub original source plus wheel/sdist; no provider rows or private checkpoint bytes",
              "verified_public_aggregate_inventory_sha256": candidate["entries_sha256"],
              "build_artifacts": files,
          }
          Path("release-artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Refuse tag collision or previously published release
        shell: bash
        run: |
          test -z "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: refuse mutation"
            exit 1
          fi

      - name: Create immutable tag and publish source-only GitHub Release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "FPD Bench software $RELEASE_VERSION: source-only research release"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz release-artifact-manifest.json \
            --verify-tag \
            --title "FPD Bench v1.0.0 — Public Research Software" \
            --notes-file docs/release-v1.0.0.md
          gh release view "$RELEASE_TAG" --json tagName,assets,url,isPrerelease
