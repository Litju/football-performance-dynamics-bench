name: validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin PR #25 source package
        run: |
          git fetch --no-tags origin aad8888eb6c7c046e4dfbce866886bf2ec8dd123
          test "$(git rev-parse FETCH_HEAD)" = "aad8888eb6c7c046e4dfbce866886bf2ec8dd123"
          mkdir -p "$RUNNER_TEMP/pr25-package"
          git archive FETCH_HEAD src/fpdbench | tar -x -C "$RUNNER_TEMP/pr25-package"
          echo "FPDBENCH_PR25_PACKAGE_ROOT=$RUNNER_TEMP/pr25-package/src/fpdbench" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run fpdbench validate-naming
      - run: uv run fpdbench validate

  public-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pin PR #25 source package
        run: |
          git fetch --no-tags origin aad8888eb6c7c046e4dfbce866886bf2ec8dd123
          test "$(git rev-parse FETCH_HEAD)" = "aad8888eb6c7c046e4dfbce866886bf2ec8dd123"
          mkdir -p "$RUNNER_TEMP/pr25-package"
          git archive FETCH_HEAD src/fpdbench | tar -x -C "$RUNNER_TEMP/pr25-package"
          echo "FPDBENCH_PR25_PACKAGE_ROOT=$RUNNER_TEMP/pr25-package/src/fpdbench" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv run fpdbench validate-naming
      - run: uv run fpdbench validate
      - run: uv run fpdbench evidence validate
      - run: uv run fpdbench reproducibility check
      - run: uv build
      - run: uv run python tools/wheel_smoke.py dist/*.whl dist/*.tar.gz
