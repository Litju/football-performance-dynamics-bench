[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "football-performance-dynamics-bench"
version = "0.1.0.dev0"
description = "Reproducible research benchmarks for football performance dynamics"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "Football Performance Dynamics Bench contributors" }]
dependencies = []

[project.scripts]
fpdbench = "fpdbench.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12", "pyright>=1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/fpdbench"]

[tool.hatch.build.targets.wheel.force-include]
"src/fpdbench/evaluation/absolute_xy_calibration_lock.json" = "fpdbench/evaluation/absolute_xy_calibration_lock.json"
"src/fpdbench/data_sources/skillcorner_open_data_v1.json" = "fpdbench/data_sources/skillcorner_open_data_v1.json"
"src/fpdbench/data_sources/skillcorner_croissant_rai_draft.json" = "fpdbench/data_sources/skillcorner_croissant_rai_draft.json"
"src/fpdbench/data_states/skillcorner_5hz_v1.json" = "fpdbench/data_states/skillcorner_5hz_v1.json"
"src/fpdbench/eligibility/skillcorner_window_v1.json" = "fpdbench/eligibility/skillcorner_window_v1.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
