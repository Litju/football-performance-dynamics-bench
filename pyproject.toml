[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "football-performance-dynamics-bench"
version = "0.1.0.dev0"
description = "Reproducible research benchmarks for football performance dynamics"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "Football Performance Dynamics Bench contributors" }]
dependencies = []

[project.scripts]
fpdbench = "fpdbench.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12", "pyright>=1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/fpdbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
